name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assets_test
          POSTGRES_USER: assets
          POSTGRES_PASSWORD: assets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assets -d assets_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://assets:assets_test@localhost:5432/assets_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: '1.25.x', cache: true }
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags=integration -race ./internal/postgres
      - run: go build ./cmd/api ./cmd/migrate ./cmd/seed
