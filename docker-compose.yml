services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: assets, POSTGRES_USER: assets, POSTGRES_PASSWORD: assets_dev }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U assets -d assets"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["assets_data:/var/lib/postgresql/data"]
  migrate:
    build: .
    entrypoint: ["assets-migrate"]
    environment: { DATABASE_URL: "postgres://assets:assets_dev@db:5432/assets?sslmode=disable" }
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
  seed:
    build: .
    entrypoint: ["assets-seed"]
    environment:
      DATABASE_URL: postgres://assets:assets_dev@db:5432/assets?sslmode=disable
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: AdminPass123!
      SEED_CUSTODIAN_EMAIL: custodian@example.com
      SEED_CUSTODIAN_PASSWORD: Custodian123!
      SEED_EMPLOYEE_EMAIL: employee@example.com
      SEED_EMPLOYEE_PASSWORD: Employee123!
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
  api:
    build: .
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://assets:assets_dev@db:5432/assets?sslmode=disable
      JWT_SECRET: local-docker-secret-change-before-sharing
      JWT_EXPIRY: 30m
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
volumes: { assets_data: {} }
